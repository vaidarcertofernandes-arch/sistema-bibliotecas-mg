<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=index.html">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acessar Mapa das Bibliotecas Públicas e Comunitárias de MG</title>
  <style>
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: linear-gradient(135deg, #1e3a8a, #0f172a);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 40px;
      max-width: 520px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }
    .icon { font-size: 3.5rem; margin-bottom: 12px; }
    h1 { font-size: 1.6rem; margin: 0 0 8px 0; color: #ffffff; }
    p { color: #cbd5e1; font-size: 0.95rem; line-height: 1.5; margin-bottom: 24px; }
    a.btn {
      display: inline-block;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-weight: 600;
      padding: 12px 28px;
      border-radius: 8px;
      transition: background 0.2s;
    }
    a.btn:hover { background: #1d4ed8; }
  </style>
  <script>
    window.location.replace("index.html");
  </script>
</head>
<body>
  <div class="card">
    <div class="icon">📚</div>
    <h1>Sistema de Bibliotecas de Minas Gerais</h1>
    <p>Redirecionando para a plataforma interativa de mapeamento das bibliotecas públicas e comunitárias...</p>
    <a class="btn" href="index.html">Clique aqui se não abrir automaticamente</a>
  </div>
</body>
</html>
