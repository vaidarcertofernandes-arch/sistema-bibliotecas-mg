<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=00_Plataforma_Publico_Geral/index.html">
  <title>Sistema de Bibliotecas de Minas Gerais (SEBPC/MG)</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      box-sizing: border-box;
    }
    .card {
      background: #ffffff;
      padding: 2.5rem 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      display: block;
    }
    h1 {
      font-size: 1.35rem;
      margin: 0 0 0.5rem 0;
      color: #1e3a8a;
    }
    p {
      color: #64748b;
      font-size: 0.95rem;
      margin-bottom: 2rem;
      line-height: 1.5;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .btn {
      display: block;
      padding: 0.85rem 1.25rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-primary {
      background: #b91c1c;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #991b1b;
    }
    .btn-secondary {
      background: #1e3a8a;
      color: #ffffff;
    }
    .btn-secondary:hover {
      background: #172554;
    }
  </style>
  <script>
    window.location.replace("00_Plataforma_Publico_Geral/index.html");
  </script>
</head>
<body>
  <div class="card">
    <span class="icon">🏛️</span>
    <h1>Sistema de Bibliotecas de Minas Gerais</h1>
    <p>Redirecionando para a Plataforma Pública do SEBPC/MG...</p>
    <div class="btn-group">
      <a class="btn btn-primary" href="00_Plataforma_Publico_Geral/index.html">Acessar Mapa Público</a>
      <a class="btn btn-secondary" href="00_Plataforma_Gestao/index.html">Acessar Área de Gestão</a>
    </div>
  </div>
</body>
</html>
